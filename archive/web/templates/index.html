<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股选股助手 - 数据选择</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 A股选股助手</h1>
            <p class="subtitle">数据选择和管理</p>
        </header>

        <main>
            <!-- Google Drive 下载区域 -->
            <section class="card">
                <h2>📥 从Google Drive下载数据库</h2>
                <div class="drive-section">
                    <div class="form-group">
                        <label for="folderId">文件夹ID（可选，留空使用默认配置）:</label>
                        <input type="text" id="folderId" placeholder="输入Google Drive文件夹ID">
                    </div>
                    <div class="button-group">
                        <button onclick="listDriveFiles()" class="btn btn-secondary">查看可用文件</button>
                        <button onclick="downloadAllDatabases()" class="btn btn-primary">下载所有数据库</button>
                    </div>
                    <div id="driveFilesList" class="files-list"></div>
                </div>
            </section>

            <!-- 本地数据库列表 -->
            <section class="card">
                <h2>💾 本地数据库</h2>
                <div class="database-section">
                    <button onclick="loadDatabases()" class="btn btn-primary">刷新列表</button>
                    <div id="databasesList" class="databases-list"></div>
                </div>
            </section>

            <!-- 数据浏览区域 -->
            <section class="card" id="dataViewer" style="display: none;">
                <h2>🔍 数据浏览</h2>
                <div class="viewer-section">
                    <div class="viewer-header">
                        <span id="currentDb">数据库: -</span>
                        <span id="currentTable">表: -</span>
                        <button onclick="closeViewer()" class="btn btn-secondary">关闭</button>
                    </div>
                    <div id="tablesList" class="tables-list"></div>
                    <div id="tableData" class="table-data"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- 加载提示 -->
    <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
        <p>加载中...</p>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
